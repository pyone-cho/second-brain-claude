# =============================================================================
# Second Brain — Nginx Configuration
# =============================================================================
# This file is installed to /etc/nginx/sites-available/second-brain
# =============================================================================

server {
    listen 80;
    server_name _;

    # ---------------------------------------------------------------------------
    # Security headers
    # ---------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------------------
    # Gzip compression
    # ---------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2
        font/woff;

    # ---------------------------------------------------------------------------
    # Frontend static files
    # ---------------------------------------------------------------------------
    root /home/kpc/repos/second-brain-claude/frontend/dist;
    index index.html;

    # ---------------------------------------------------------------------------
    # API proxy → Express backend
    # ---------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Don't cache API responses
        add_header Cache-Control "no-store" always;
    }

    # ---------------------------------------------------------------------------
    # Cache static assets aggressively
    # ---------------------------------------------------------------------------
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------------------------------------------------------------------------
    # SPA fallback — serve index.html for all non-file, non-API routes
    # ---------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # Prevent caching of the HTML shell
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate" always;
        }
    }

    # ---------------------------------------------------------------------------
    # Deny access to hidden files
    # ---------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
