# =============================================================================
# SSL override for docker-compose.yml
# =============================================================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.ssl.yml up -d
#
# Prerequisites:
#   1. Generate certificates:  ./ssl/generate-self-signed.sh
#   2. Or place your own cert/key in ssl/server.crt and ssl/server.key
# =============================================================================

services:
  frontend:
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl/server.crt:/etc/nginx/ssl/server.crt:ro
      - ./ssl/server.key:/etc/nginx/ssl/server.key:ro
